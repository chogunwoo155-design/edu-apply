# 과제 확인용 데모 배포 (Render 무료 플랜). 운영 목표 구성은 docs/DEPLOY_AWS.md
# Render 대시보드 → New → Blueprint → 이 저장소를 고르면 웹과 DB를 같이 만든다. main에 push하면 다시 배포된다.
services:
  - type: web
    name: edu-apply
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: sh deploy/render_start.sh
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edu-apply-db
          property: connectionString
      # 데모에는 실제 메일 서버를 붙이지 않는다 (발송 내용은 서버 로그와 관리 화면 발송 기록으로 확인)
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DEMO_NOTICE
        value: "1"
      # 관리 화면 demo 계정 비밀번호. Render가 무작위로 만들고, 저장소에는 남기지 않는다
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      # 여러 사람이 같은 프록시 IP로 보일 수 있어 데모는 제한을 넉넉하게
      - key: APPLY_RATE_LIMIT
        value: 60/hour

databases:
  - name: edu-apply-db
    plan: free
    region: singapore
    databaseName: edu_apply
    user: edu
    postgresMajorVersion: "17"
    ipAllowList: []
