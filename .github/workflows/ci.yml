name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: edu_apply
          POSTGRES_USER: edu
          POSTGRES_PASSWORD: edu-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edu -d edu_apply"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: postgres://edu:edu-ci@localhost:5432/edu_apply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python -m pytest
      - name: 배포 설정 점검
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-but-long-enough-to-pass-the-deploy-check-0123456789
          DJANGO_ALLOWED_HOSTS: example.com
          EMAIL_HOST: smtp.example.com

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edu-apply .
